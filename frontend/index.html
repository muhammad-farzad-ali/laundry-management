<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Status</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Laundry Status</h1>
    </header>

    <main>
        <div class="filters">
            <div class="filter-group">
                <label for="dormitory-filter">Dormitory</label>
                <select id="dormitory-filter">
                    <option value="">All Dormitories</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="type-filter">Machine Type</label>
                <select id="type-filter">
                    <option value="">All Types</option>
                </select>
            </div>
        </div>

        <div id="machine-list" class="machine-list"></div>
    </main>

    <div id="modal-overlay" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">Update Status</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Operational</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="operational" value="yes"> Yes
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="operational" value="no"> No
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Occupied</label>
                    <div class="radio-group">
                        <label class="radio-label" id="occupied-yes-label">
                            <input type="radio" name="occupied" id="occupied-yes" value="yes"> Yes
                        </label>
                        <label class="radio-label" id="occupied-no-label">
                            <input type="radio" name="occupied" id="occupied-no" value="no"> No
                        </label>
                    </div>
                </div>

                <div id="occupied-fields" class="hidden">
                    <div class="form-group">
                        <label>Duration</label>
                        <div class="timer-inputs">
                            <input type="number" id="timer-hours" min="0" max="23" value="1" class="timer-input">
                            <span>hour(s)</span>
                            <input type="number" id="timer-minutes" min="0" max="59" value="20" class="timer-input">
                            <span>min</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="occupant-name">Your Name (optional)</label>
                        <input type="text" id="occupant-name" placeholder="Enter your name" maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="occupant-phone">Phone (optional)</label>
                        <div class="phone-input">
                            <input type="text" id="occupant-country-code" value="+49" class="country-code">
                            <input type="tel" id="occupant-phone" placeholder="Phone number" maxlength="20">
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn btn-confirm" onclick="confirmUpdate()">Update</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
